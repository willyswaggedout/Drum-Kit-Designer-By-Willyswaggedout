# Builds the Windows app on GitHub's servers.
# Every push to main builds it; download the result from the run's "Artifacts".
# Push a tag like v1.1.0 to also publish a release with the downloads attached. The installed app
# checks the newest release on launch and offers to update (it reads latest.yml from the release).
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build "Delete Drum Kit Designer.exe"
        working-directory: tools/delete
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../dist/Delete Drum Kit Designer.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: Drum-Kit-Designer-Windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Drum Kit Designer ${{ github.ref_name }}
          body: |
            **To install:** download the `Drum-Kit-Designer-Setup` .exe below and run it.
            Already installed? The app finds this update by itself the next time you open it.
            `Delete Drum Kit Designer.exe` removes the program and all of its saved data.
          files: out/*
